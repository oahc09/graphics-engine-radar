[project]
name = "radar-collector"
version = "0.1.0"
description = "Collector service: scheduling, adapter dispatch, normalize and dedup into RawItem"
requires-python = ">=3.12"
dependencies = [
    "radar-domain",
    "radar-adapters",
    "click>=8.1",
]

[project.scripts]
radar-collector = "radar_collector.cli:collector"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["radar_collector"]
