[project]
name = "graphics-radar"
version = "0.1.0"
description = "Graphics Engine Radar — graphics technology intelligence system"
requires-python = ">=3.12"
dependencies = [
    "pgserver>=0.1.4",
    "psutil>=7.2.2",
]

[tool.uv.workspace]
members = [
    "packages/domain",
    "packages/adapters",
    "packages/prompts",
    "services/collector",
    "services/intelligence",
    "apps/api",
]

[tool.uv.sources]
radar-domain = { workspace = true }
radar-adapters = { workspace = true }
radar-prompts = { workspace = true }
radar-collector = { workspace = true }
radar-intelligence = { workspace = true }
radar-api = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "radar-domain",
    "radar-adapters",
    "radar-prompts",
    "radar-collector",
    "radar-intelligence",
    "radar-api",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
