[project]
name = "radar-adapters"
version = "0.1.0"
description = "Source adapters (GitHub, RSS, ReleaseNotes, HTML, SpecRegistry) for Graphics Engine Radar"
requires-python = ">=3.12"
dependencies = [
    "radar-domain",
    "httpx>=0.27",
    "feedparser>=6.0",
    "lxml>=5",
    "beautifulsoup4>=4.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["radar_adapters"]
