[project]
name = "radar-api"
version = "0.1.0"
description = "FastAPI backend for Graphics Engine Radar"
requires-python = ">=3.12"
dependencies = [
    "radar-domain",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["radar_api"]
